services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7890:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - app-net
    environment:
      - VITE_API_URL=http://localhost:7891

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7891:8000"
    depends_on:
      - db-init
    networks:
      - app-net
    environment:
      - DB_HOST=xampp
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=makanantar

  xampp:
    image: tomsik68/xampp:8
    ports:
      - "8080:80"
      - "3306:3306"
    volumes:
      - xampp-data:/opt/lampp
    networks:
      - app-net

  db-init:
    image: tomsik68/xampp:8
    network_mode: service:xampp
    depends_on:
      - xampp
    volumes:
      - ./backend/sql:/sql
    command: >
      sh -c "
        echo 'Waiting for MySQL...' &&
        for i in \$(seq 1 30); do
          if /opt/lampp/bin/mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
            break
          fi
          sleep 1
        done &&
        /opt/lampp/bin/mysql -h 127.0.0.1 -u root -e \"CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY ''; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;\" &&
        /opt/lampp/bin/mysql -h 127.0.0.1 -u root < /sql/schema.sql &&
        /opt/lampp/bin/mysql -h 127.0.0.1 -u root < /sql/migration.sql &&
        /opt/lampp/bin/mysql -h 127.0.0.1 -u root < /sql/seed.sql
      "

networks:
  app-net:
    driver: bridge

volumes:
  xampp-data:
